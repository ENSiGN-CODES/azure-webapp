- name: Install Docker on all private app VMs and run latest image from ACR.
  hosts: proxy
  become: true
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes

    - name: Install required dependencies for Docker
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present

    - name: Add Docker GPG key
      ansible.builtin.shell: |
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        chmod a+r /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Add Docker apt repository
      ansible.builtin.shell: |
        echo \
          "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
          https://download.docker.com/linux/ubuntu \
          $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
      args:
        creates: /etc/apt/sources.list.d/docker.list

    - name: Update apt cache after adding Docker repo
      ansible.builtin.apt:
        update_cache: yes

    - name: Install Docker Engine
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
      register: docker_install_output

    - name: Print Docker install output
      debug:
        var: docker_install_output.stdout_lines

    - name: Start and enable Docker service
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: yes
      register: docker_service_output

    - name: Print Docker service output
      debug:
        var: docker_service_output

    - name: Log in to Azure Container Registry (ACR)
      # Uses the ACR admin credentials stored as environment variables from GitHub Secrets
      ansible.builtin.shell: |
        echo "{{ acr_password }}" | docker login {{ acr_login_server }} -u {{ acr_username }} --password-stdin
      no_log: true

    - name: Pull latest Docker image from ACR
      # Image is tagged with git commit SHA — same pattern as original ECR approach
      ansible.builtin.command: >
        docker pull {{ acr_login_server }}/monty-hall-game:{{ image_tag }}
      register: pull_output

    - name: Print pull output
      debug:
        var: pull_output.stdout_lines

    - name: Stop and remove any existing container
      ansible.builtin.shell: |
        docker stop ACR-Container 2>/dev/null || true
        docker rm ACR-Container 2>/dev/null || true

    - name: Run Docker container from ACR image
      # Port mapping 80:5000 mirrors the original — LB sends :80, Flask listens on :5000
      ansible.builtin.command: >
        docker run -d --name ACR-Container
        --restart unless-stopped
        -p 80:5000
        {{ acr_login_server }}/monty-hall-game:{{ image_tag }}
      register: run_output

    - name: Print container run output
      debug:
        var: run_output.stdout_lines
